services:
 mariadb:
  build: ./requirements/mariadb
  container_name: mariadb
  secrets:
   - db_password
   - db_root_password
  environment:
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    MYSQL_USER: ${MYSQL_USER}
  networks:
   - inception
  volumes:
   - database:/var/lib/mysql
  restart: unless-stopped
  healthcheck:
   test: ["CMD", "mariadb", "-e", "SELECT 1"]
   interval: 5s
   timeout: 5s
   retries: 5 


 wordpress:
  build: ./requirements/wordpress

  container_name: wordpress

  environment:
   MYSQL_DATABASE: ${MYSQL_DATABASE}
   MYSQL_USER: ${MYSQL_USER}
   DOMAIN_NAME: ${DOMAIN_NAME}
   WP_TITLE: ${WP_TITLE}
   WP_ADMIN_USER: ${WP_ADMIN_USER}
   WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
   WP_GUEST_USER: ${WP_GUEST_USER}
   WP_GUEST_EMAIL: ${WP_GUEST_EMAIL}

  secrets:
   - db_password
   - wp_admin_password

  volumes:
   - wordpress-data:/var/www/html

  networks:
   - inception

  depends_on:
   mariadb:
    condition: service_healthy
   redis:
    condition: service_healthy

  restart: unless-stopped

 nginx:
  build: ./requirements/nginx
  container_name: nginx
  environment:
   DOMAIN_NAME: ${DOMAIN_NAME}
  volumes:
   - wordpress-data:/var/www/html
  networks:
   - inception
  depends_on:
   - wordpress
  ports:
   - "443:443"
  restart: unless-stopped

 redis:
  build: ./requirements/redis
  container_name: redis
  networks:
   - inception
  restart: unless-stopped
  healthcheck:
   test: ["CMD", "redis-cli", "ping"]
   interval: 5s
   timeout: 5s
   retries: 5

networks:
 inception:

volumes:
 database:
  driver: local
  driver_opts:
   type: none
   device: ${DATA_PATH}/data/database
   o: bind

 wordpress-data:
  driver: local
  driver_opts:
   type: none
   device: ${DATA_PATH}/data/wordpress
   o: bind

secrets:
 db_password:
  file: ../secrets/db_password.txt

 db_root_password:
  file: ../secrets/db_root_password.txt

 wp_admin_password:
  file: ../secrets/wp_admin_password.txt
